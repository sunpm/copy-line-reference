name: Build and release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build plugin
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ./gradlew buildPlugin "-PpluginVersion=${GITHUB_REF_NAME#v}"
          else
            ./gradlew buildPlugin
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: dist
      - name: Publish plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.zip
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --notes-file "releases/$GITHUB_REF_NAME.md" --generate-notes
